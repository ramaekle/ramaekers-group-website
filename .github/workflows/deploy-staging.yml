name: Deploy staging (staging.ramaekersgroup.com)
# Runs only when Larry presses Run workflow on main, types STAGE and the commit named in "Ready for Staging".
# Refuses unless main is exactly at that commit, so only the reviewed version is staged. Freezes and fingerprints the build.
# Staging sits behind Cloudflare Access (sign-in). Production is not deployable from this repo yet.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type STAGE to publish main to staging.ramaekersgroup.com"
        required: true
      commit:
        description: "Commit from the Ready for Staging message (at least 7 characters); refused if main has moved"
        required: true
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ inputs.confirm == 'STAGE' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check main is at the reviewed commit
        env:
          WANT: ${{ inputs.commit }}
          HAVE: ${{ github.sha }}
        run: |
          want=$(printf %s "$WANT" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          case "$want" in *[!0-9a-f]*|"") echo "Commit must be letters a-f and digits only"; exit 1;; esac
          [ ${#want} -ge 7 ] || { echo "Give at least 7 characters of the commit"; exit 1; }
          case "$HAVE" in "$want"*) echo "main is at the reviewed commit $want ($HAVE)" | tee -a "$GITHUB_STEP_SUMMARY";;
            *) echo "REFUSED: main is at $HAVE, not the reviewed commit $want. Ask for a fresh review of the new commit." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record the build fingerprint
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > staged-files.sha256
          fp=$(sha256sum staged-files.sha256 | cut -c1-64)
          echo "$fp" > fingerprint.txt
          echo "Staged fingerprint: $fp (commit ${{ github.sha }})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the staged build (production will deploy only these bytes)
        uses: actions/upload-artifact@v4
        with:
          name: staged-build
          path: |
            dist
            staged-files.sha256
            fingerprint.txt
          retention-days: 90
      - name: Check the Cloudflare token (prints only yes/no and error codes, never the token)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail=0
          chk() { echo "== $1"; r=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$2"); echo "$r" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d.get("success"), "| errors:", [(e.get("code"), e.get("message")) for e in d.get("errors", [])])'; echo "$r" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)' || fail=1; }
          chk "token valid for this account" "/accounts/$CF_ACCT/tokens/verify"
          chk "can list Workers" "/accounts/$CF_ACCT/workers/scripts"
          chk "can see zone ramaekersgroup.com" "/zones?name=ramaekersgroup.com"
          exit $fail
      - name: Deploy the staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.0"
          command: deploy
      - name: Confirm staging is behind the sign-in
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://staging.ramaekersgroup.com/)
          echo "unsigned visitor gets HTTP $code (302 or 403 expected: Cloudflare Access)"
          case "$code" in 302|403) ;; *) echo "Staging is NOT protected"; exit 1;; esac
